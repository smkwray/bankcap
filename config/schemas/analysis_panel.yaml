name: bankcap_analysis_panel
version: 1
frequency: monthly_or_weekly
primary_key:
  - period
  - bank_group
claim_boundary: >-
  The merged analysis panel supports descriptive mechanism screening only. It is not a causal or
  bank-level identification panel.
columns:
  - name: period
    dtype: string
    required: true
  - name: date
    dtype: datetime
    required: true
  - name: frequency
    dtype: string
    required: true
    allowed_values: [weekly, monthly]
  - name: bank_group
    dtype: string
    required: true
  - name: securities_usd_millions
    dtype: numeric
    required: true
  - name: deposits_usd_millions
    dtype: numeric
    required: true
  - name: loans_usd_millions
    dtype: numeric
    required: true
  - name: cash_assets_usd_millions
    dtype: numeric
    required: true
  - name: securities_deposits_ratio
    dtype: numeric
    required: true
  - name: cash_deposits_ratio
    dtype: numeric
    required: true
  - name: loans_deposits_ratio
    dtype: numeric
    required: true
  - name: bill_share
    dtype: numeric
    required: false
  - name: coupon_share
    dtype: numeric
    required: false
  - name: wam_months
    dtype: numeric
    required: false
  - name: gross_issuance_usd
    dtype: numeric
    required: false
  - name: liquidity_weighted_treasury_supply_usd
    dtype: numeric
    required: false
  - name: tga_change_usd_millions
    dtype: numeric
    required: false
  - name: qt_qe_regime
    dtype: string
    required: true
  - name: high_rate_regime
    dtype: bool
    required: true
  - name: bill_heavy_month
    dtype: bool
    required: true
  - name: coupon_heavy_month
    dtype: bool
    required: true
  - name: high_bill_share_month
    dtype: bool
    required: true
  - name: low_bill_share_month
    dtype: bool
    required: true
  - name: bill_share_bucket
    dtype: string
    required: true
  - name: slr_relief_window
    dtype: bool
    required: true
  - name: rate_duration_shock_window
    dtype: bool
    required: true
  - name: banking_stress_2023_window
    dtype: bool
    required: true
  - name: large_tga_rebuild_window
    dtype: bool
    required: true
  - name: is_context_complete
    dtype: bool
    required: true
