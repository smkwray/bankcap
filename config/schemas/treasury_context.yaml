name: treasury_context
version: 1
frequency: monthly_or_weekly
primary_key:
  - period
claim_boundary: >-
  Treasury context variables are descriptive financing, liquidity, and plumbing context. Liquidity
  weights are measurement assumptions, not structural facts.
columns:
  - name: period
    dtype: string
    required: true
  - name: date
    dtype: datetime
    required: true
  - name: frequency
    dtype: string
    required: true
    allowed_values: [weekly, monthly]
  - name: bill_share
    dtype: numeric
    required: false
    description: "Share of gross issuance or ladder basis accounted for by bills, in [0, 1]."
  - name: coupon_share
    dtype: numeric
    required: false
  - name: wam_months
    dtype: numeric
    required: false
    description: "Weighted-average maturity in months."
  - name: gross_issuance_usd
    dtype: numeric
    required: false
  - name: liquidity_weighted_treasury_supply_usd
    dtype: numeric
    required: false
  - name: tga_change_usd_millions
    dtype: numeric
    required: false
  - name: qt_qe_regime
    dtype: string
    required: true
    allowed_values: [QT, QE, neutral, unknown]
  - name: high_rate_regime
    dtype: bool
    required: true
  - name: bill_heavy_month
    dtype: bool
    required: true
  - name: coupon_heavy_month
    dtype: bool
    required: true
  - name: slr_relief_window
    dtype: bool
    required: true
  - name: rate_duration_shock_window
    dtype: bool
    required: true
  - name: banking_stress_2023_window
    dtype: bool
    required: true
  - name: large_tga_rebuild_window
    dtype: bool
    required: true
  - name: context_source_notes
    dtype: string
    required: false
